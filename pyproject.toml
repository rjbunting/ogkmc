[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autokmc"
version = "0.1.0"
description = "Automated kinetic Monte Carlo (KMC) setup pipeline for metal surfaces and nanoparticles."
readme = "AGENTS.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "onlinekmc developers" }]

# Mandatory runtime dependencies — every public entry point in
# autokmc.* depends on these.  Optional backends (RDKit, pymatgen,
# WulffPack) live under [project.optional-dependencies] so users can
# install only what they need.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "ase>=3.23",
]

[project.optional-dependencies]
nanoparticle = ["wulffpack>=1.0"]
slab = ["pymatgen>=2023.0.0"]
reactants = ["rdkit>=2022.9"]
all = ["wulffpack>=1.0", "pymatgen>=2023.0.0", "rdkit>=2022.9"]

dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["autokmc*"]
exclude = ["autokmc.dev*"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # line length handled by formatter; long docstring lines OK
    "E741",   # ambiguous names (k, l, n) are domain-correct here
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # ase/networkx/rdkit have partial / no stubs
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false   # too aggressive for the existing code
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

