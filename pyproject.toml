[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autokmc"
version = "0.6.9"
description = "Surface kinetic Monte Carlo input generation from atomic structures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rhysay Bee" }]
keywords = ["kmc", "kinetic-monte-carlo", "surface", "catalysis", "ase"]

dependencies = [
    "ase>=3.22",
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "pymatgen>=2023.10.0",
    "wulffpack>=1.3",
    "rdkit>=2023.3",
    "tomli>=2; python_version<'3.11'",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
ml = ["nequip", "torch"]
dev = [
    "matplotlib",
    "jupyter",
    "mypy>=1.13",
    "ruff>=0.8",
]
cli = ["pyyaml>=6"]
test = ["pytest>=7", "pytest-cov>=5", "pyyaml>=6"]

[project.scripts]
autokmc = "autokmc.cli.main:main"

[tool.setuptools.packages.find]
include = ["autokmc*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
autokmc = ["py.typed", "schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Correctness checks can gate CI without forcing a package-wide formatting
# rewrite in the same scientific-method change.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["autokmc/schema/"]
