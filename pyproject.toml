[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autokmc"
version = "0.6.9"
description = "Surface kinetic Monte Carlo input generation from atomic structures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rhysay Bee" }]
keywords = ["kmc", "kinetic-monte-carlo", "surface", "catalysis", "ase"]

dependencies = [
    "ase>=3.22",
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "pymatgen>=2023.10.0",
    "wulffpack>=1.3",
    "rdkit>=2023.3",
]

[project.optional-dependencies]
ml = ["nequip", "torch"]
dev = ["matplotlib", "jupyter"]
cli = ["pyyaml>=6"]
test = ["pytest>=7", "pyyaml>=6"]

[project.scripts]
autokmc = "autokmc.cli.main:main"

[tool.setuptools.packages.find]
include = ["autokmc*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
autokmc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
