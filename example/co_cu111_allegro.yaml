# autokmc — CO on Cu(111) with NequIP
# Run with:    autokmc run example/co_cu111_allegro.yaml
schema_version: "1"

output:
  dir: ./runs/co_cu111_nequip
  trajectory_dump_every: 10
  log_level: INFO

structure:
  kind: surface
  composition: Cu
  crystal_structure: fcc
  miller_index: [1, 1, 1]
  lattice_constant: 3.615
  min_slab_size: 8.0
  min_vacuum_size: 12.0
  goal_x: 15.0
  goal_y: 15.0
  n_freeze_layers: 2

reactants:
  - smiles: "[C]=O"
    add_hydrogens: false
    relax_in_gas: true

# NequIPCalculator must be created via its factory method, not direct
# instantiation — use `factory` + `factory_kwargs` only.
# Set `compile_path` to your compiled NequIP model (.pt2 for CUDA, .pth for CPU).
calculator:
  factory: nequip.ase.NequIPCalculator.from_compiled_model
  factory_kwargs:
    compile_path: ./autokmc/dev/cpuhcocuau.nequip.pth
    device: cpu

adsorbate_sites:
  prune_stable_only: true
  fmax: 0.05
  max_steps: 500

kmc:
  temperature_k: 500.0
  n_steps: 50
  transmission_coefficient: 1.0
  fmax: 0.05
  max_steps: 500
  log_every: 1
  random_seed: 69
  # Set lateral_interactions: false to ignore neighbour occupancy when
  # classifying lateral environments.  Every site member will always map to
  # the single bare lat0, so only one ML relaxation per iso-class is needed.
  # The lateral-shell incremental update is also skipped each KMC step,
  # reducing overhead at high coverage.  Default: true.
  lateral_interactions: true

# Diffusion (NEB) channel.  Enabled by default; set `enabled: false` to
# run adsorption / desorption only.  Each new (iso, lateral) pair triggers
# one CI-NEB calculation; the raw transition-state energy is saved in
# reactions/diffusion/diff_iso{X}_lat{Y}/reaction.json and the KMC barrier
# is floored at EA_MIN (0.1 eV).
diffusion:
  enabled: true
  max_hops: 0            # 0 = "share a surface atom"
  n_shells_pair: 1
  fmax: 0.05
  max_steps: 500
  n_images: 5
  climb: true
  spring_k: 0.1
  interpolation: linear   # "linear" (default) or "idpp"
  persist_neb_path: false

# Bond-changing reactions (A + B ⇌ C on the surface).
#
# When `enabled: true` the CLI:
#   1. Derives BondReactionTemplates from every reactant SMILES via
#      `derive_bond_templates` (dissociation + coupling).
#   2. Auto-builds Reactants + adsorbate sites for any "leaf" species
#      (fragments / coupling products) the templates reference but the
#      user did not list under `reactants`.  Set
#      `auto_build_leaf_species: false` to instead raise.
#   3. Calls `find_bond_sites` to enumerate the BondReactionSite
#      iso-classes on the live graph (folder layout:
#      reactions/bond/bond_iso{X}_lat{Y}/).
#   4. Bootstraps `initialise_bond_registry` so future coupling events
#      that introduce a new species extend the network mid-run via
#      `expand_bond_sites_after_event`.
#
# Note: requires charge-free SMILES (e.g. "[C]=O", not "[C-]#[O+]").
# The KMC inner loop fires bond events alongside adsorption / desorption
# and diffusion; CI-NEB barriers are computed lazily per (iso, lateral)
# class and persisted under reactions/bond/.
bond:
  enabled: true
  bond_max_hops: 0                # 0 = "share a surface atom" between A and B / between A∪B and C
  bond_types: ["SINGLE", "DOUBLE", "TRIPLE"]   # cleavable / formed bond orders
  include_ring_bonds: false
  include_dissociation: true
  include_coupling: true
  include_homo_coupling: true
  deduplicate_iso: true
  auto_build_leaf_species: true
  # ── Pruning ──────────────────────────��──────────────────────────────
  pair_n_shells: 1
  prune_by_triple: true
  prune_with_calculator: true
  prune_fmax: 0.05
  prune_max_steps: 200
  # ── NEB knobs (used by check_bond_site_stability inside the KMC loop)
  neb_fmax: 0.05
  neb_max_steps: 500
  neb_n_images: 5
  neb_climb: true
  neb_spring_k: 0.1
  neb_interpolation: linear        # "linear" or "idpp"
  persist_neb_path: false

