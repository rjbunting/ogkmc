name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[cli,test,dev]"
      - run: python -m compileall -q ogkmc
      - run: ruff check ogkmc tests
      - name: Type-check persistence and typed runtime boundaries
        if: matrix.python-version == '3.10'
        run: >-
          mypy --follow-imports=skip
          ogkmc/io/_files.py
          ogkmc/io/config.py
          ogkmc/io/checkpoint.py
          ogkmc/io/calculation_cache.py
          ogkmc/io/calculators.py
          ogkmc/io/config_validation.py
          ogkmc/io/event_log.py
          ogkmc/io/persistence.py
          ogkmc/io/reaction_graph.py
          ogkmc/io/resume_contract.py
          ogkmc/io/trajectory.py
          ogkmc/analysis/products.py
          ogkmc/core/graph_state.py
          ogkmc/sites/identity.py
          ogkmc/kmc
          ogkmc/workflow
          ogkmc/utils/telemetry.py
      - run: pytest --cov=ogkmc --cov-report=term-missing --cov-report=xml --cov-fail-under=50
